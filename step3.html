<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Step Navigation -->
    <table style=" margin-left:300px ;font-size: 15px; font-weight: 500; background-color:rgb(172, 188, 189)"
        cellpadding="15">
        <tr>
            <td style="background-color: #99d05ee2;">Step 1:Account Details </td>
            <td style="background-color: #99d05ee2;;">Step 2: Personal Details</td>
            <td style="background-color:#1eaee3e2;">Step 3: Your Review</td>
        </tr>
    </table>

    <br>
    <br>


    <!-- Your Review Form -->


    <fieldset style="width: 470px; margin-left:300px">
        <legend style="font-weight: 600; font-size: 20px;">
            Your Review
        </legend>
        <br>
        <label for="options">How did you here about us?</label>
        <select name="options" id="options">
            <option value="">Select an option</option>
            <option value="social_media">Social Media</option>
            <option value="friend">Friend/Family</option>
            <option value="advertisement">Advertisement</option>
        </select>
        <br>
        <br>


        <label for="visit-again">Would you visit again?</label>
        <br>
        <input type="radio" id="visit-again-yes" name="visit-again" value="yes">
        <label for="visit-again-yes">Yes</label>
        <input type="radio" id="visit-again-no" name="visit-again" value="no">

        <label for="visit-again-no">no</label>
        <input type="radio" id="visit-again-maybe" name="visit-again" value="Maybe">
        <label for="visit-again-maybe">Maybe</label>
        <br>
        <br>
        <label for="comment">Comments:</label>
        <br>
        <textarea name="comments" id="comment" rows="4" cols="30"></textarea>
        <br>
        <br>
        <label for="documents">Documents:</label>
        <br>
        <input type="file" name="document" id="documents">
        <br>
        <br>
        <input type="checkbox" id="sign-me" name="sign-me" value="yes">
        <label for="sign-me">Sign me up for email updates</label>

        <br>
        <br>
        
        <!-- link to next page -->
        <a href="./step2.html">
            <img src="./buttons-images/back.png" alt="back" width="140" height="60">
        </a>
        &nbsp;&nbsp;
        <a href="./step4.html">
            <img src="./buttons-images/submit.png" alt="next" width="140" height="60">
        </a>
    </fieldset>

</body>

</html>
